[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sapien-cpu-probe"
version = "0.2.0"
description = "Agent-friendly checks for SAPIEN CPU physics and Lavapipe ray tracing on ARM Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/Meta-Intelligence-Project/sapien-cpu-probe"

[project.scripts]
sapien-cpu-probe = "sapien_cpu_probe.cli:main"

[tool.setuptools.packages.find]
include = ["sapien_cpu_probe*"]
