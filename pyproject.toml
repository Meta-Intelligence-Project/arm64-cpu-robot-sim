[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arm64-cpu-robot-sim"
version = "0.2.0"
description = "Agent-friendly checks for SAPIEN CPU physics and Lavapipe ray tracing on ARM Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/Meta-Intelligence-Project/arm64-cpu-robot-sim"

[project.scripts]
arm64-cpu-robot-sim = "arm64_cpu_robot_sim.cli:main"

[tool.setuptools.packages.find]
include = ["arm64_cpu_robot_sim*"]
